<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ауыл олимпиадасы · тренажер</title>
<style>
:root{
  --paper:#f2eee3; --sheet:#fffdf8; --ink:#1d2a44; --muted:#6b6457; --line:#e2d9c4;
  --red:#c0392b; --green:#2e7d32; --gold:#b7791f;
  --c1:#2d6a3e; --c2:#2f5d62; --c3:#6b3fa0; --c4:#1f6f8b; --c5:#a8323e; --c6:#c4581b; --c7:#8a5a14; --c8:#284b8c;
  --acc:var(--c1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 "Segoe UI",Roboto,Arial,sans-serif;
  background-image:radial-gradient(#e3d9c2 1px,transparent 1px);background-size:20px 20px}
button,input{font:inherit;color:inherit}
.wrap{max-width:1300px;margin:0 auto;padding:18px 18px 40px;display:grid;grid-template-columns:262px 1fr;gap:22px}
header.top{grid-column:1/-1;display:flex;align-items:flex-end;gap:18px;border-bottom:3px double var(--ink);padding-bottom:10px}
header.top h1{font:700 30px/1.1 Georgia,"Times New Roman",serif;margin:0}
header.top .sub{color:var(--muted);font-size:14px}
.badge{margin-left:auto;text-align:right;font:700 13px/1.3 Georgia,serif;color:var(--muted)}
.badge b{display:block;font-size:22px;color:var(--ink)}
nav.side{display:flex;flex-direction:column;gap:7px;position:sticky;top:10px;align-self:start}
.ladder-title{font:700 13px Georgia,serif;color:var(--muted);display:flex;justify-content:space-between;padding:0 4px}
.pcard{all:unset;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;background:var(--sheet);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:4px 10px 10px 4px;padding:7px 10px;box-shadow:0 1px 0 #d9cfb8;transition:transform .15s}
.pcard:hover{transform:translateX(3px)}
.pcard.on{border-color:var(--c);box-shadow:3px 3px 0 var(--c)}
.pcard .no{font:700 20px Georgia,serif;color:var(--c);text-align:center}
.pcard b{display:block;font:700 15.5px Georgia,serif;line-height:1.2}
.pcard small{color:var(--muted);font-size:12px}
.pcard .st{color:var(--gold);letter-spacing:1px;font-size:12px}
.pcard .bar{height:4px;background:#eee5d2;border-radius:3px;margin-top:4px;overflow:hidden}
.pcard .bar i{display:block;height:100%;background:var(--c);width:0;transition:width .4s}
.side .note{font-size:12.5px;color:var(--muted);padding:4px}
main{min-width:0}
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 2px 0 #d9cfb8;position:relative;overflow:hidden}
.sheet::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:1.5px;background:#efb1a8;opacity:.7}
.phead{padding:16px 22px 0 64px}
.phead h2{font:700 26px Georgia,serif;margin:0;color:var(--acc)}
.phead .pts{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:6px;padding:12px 22px 0 64px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.tab{all:unset;cursor:pointer;padding:8px 13px;border:1.5px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;background:#f3ecdc;font-weight:600;font-size:15px;position:relative;top:1.5px}
.tab.on{background:var(--sheet);color:var(--acc)}
.pane{padding:18px 26px 26px 64px}
h3{font:700 20px Georgia,serif;margin:22px 0 8px}
h3:first-child{margin-top:4px}
p{margin:6px 0 10px}
.f{font-family:"Times New Roman",Georgia,serif;font-size:21px;text-align:center;padding:10px 12px;margin:10px 0;background:#fbf6e9;border:1.5px dashed #d8c9a4;border-radius:8px;line-height:2.1}
.f.key{background:#fff3cf;border:2px solid var(--gold)}
.m{font-family:"Times New Roman",Georgia,serif;font-size:1.12em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.25}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .25em .05em}
.fr>span:last-child{padding:.05em .25em 0}
.sq{white-space:nowrap}
.sq>span{border-top:1.6px solid currentColor;padding:.12em .12em 0;margin-left:1px;display:inline-block;line-height:1.3}
.box{border-radius:10px;padding:10px 14px;margin:10px 0;border:1.5px solid}
.box.tip{background:#eef6ee;border-color:#a9cfae}
.box.warn{background:#fdeeea;border-color:#e6aba1}
.box.why{background:#eef3fa;border-color:#b6c9e3}
.know{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:8px 0 14px}
.know div{background:#fbf6e9;border:1.5px solid #e2d3ae;border-radius:10px;padding:8px 12px;font-size:15px}
.know div b{display:block;font-family:Georgia,serif;color:var(--acc);margin-bottom:2px}
/* баспалдақ */
.rungs{position:relative;margin:14px 0 0 0;padding-left:34px}
.rungs::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:4px;background:repeating-linear-gradient(var(--acc) 0 10px,transparent 10px 16px);opacity:.5;border-radius:2px}
.rung{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 12px;background:#fff;display:none;animation:pop .35s ease}
.rung.show{display:block}
.rung::before{content:attr(data-n);position:absolute;left:-34px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font:700 14px/28px Georgia;text-align:center}
.rung .lv{font:700 12px Georgia,serif;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.rung.final{border:2px solid var(--gold);background:#fffaf0}
.rung .ex{display:none;margin-top:6px;padding:7px 11px;background:#eef6ee;border-radius:8px;font-size:15px}
.rung .ex.show{display:block}
/* анимация */
.lab{display:grid;grid-template-columns:1fr 290px;gap:16px}
.stage{background:#fff;border:1.5px solid var(--line);border-radius:10px;position:relative}
.stage canvas{display:block;width:100%;height:440px}
.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl .row{background:#fbf6e9;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ctrl label{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.ctrl input[type=range]{width:100%;accent-color:var(--acc)}
.btn{all:unset;cursor:pointer;text-align:center;padding:8px 14px;border-radius:8px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:15px;box-shadow:2px 2px 0 var(--ink);transition:transform .1s}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:2px 2px 0 #1d2a44}
.btn.sm{padding:5px 10px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.readout{font-family:"Times New Roman",serif;font-size:17px;background:#1d2a44;color:#f7efd9;border-radius:8px;padding:10px 12px;line-height:1.6}
.readout b{color:#ffd57a}
.readout .ok{color:#8be08f}.readout .bad{color:#ff9b8f}
.caption{font-size:14px;color:var(--muted);margin-top:6px}
/* есеп */
.cond{background:#fffaf0;border:1.5px solid #e6d7b2;border-radius:10px;padding:12px 16px;display:flex;gap:16px;align-items:flex-start}
.cond .txt{flex:1}
.cond .src{display:inline-block;font:700 12px Georgia,serif;background:#f1e8d4;border-radius:8px;padding:1px 8px;margin-bottom:6px}
.answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.answer input{width:110px;padding:7px 9px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:17px}
.fb{font-weight:700}
.fb.ok{color:var(--green)}.fb.bad{color:var(--red)}
.steps{counter-reset:st;margin:12px 0}
.step{display:none;border-left:4px solid var(--acc);background:#fbf7ec;border-radius:0 10px 10px 0;padding:8px 14px;margin:8px 0;animation:pop .35s ease}
.step.show{display:block}
.step h4{margin:0 0 4px;font-size:16px}
.step h4::before{counter-increment:st;content:counter(st) "-қадам. ";color:var(--acc)}
.step.chk{border-left-color:var(--green);background:#f1f8f1}
.step.chk h4::before{content:"✔ Тексеру: ";color:var(--green)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hint{display:none;background:#fff8e1;border:1.5px dashed var(--gold);border-radius:8px;padding:6px 12px;margin:6px 0}
.hint.show{display:block}
.sim{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0;background:#fff;position:relative}
.sim .lvl{position:absolute;right:12px;top:10px;font:700 12px Georgia,serif;padding:2px 8px;border-radius:10px;background:#f6d9d4;color:#8c2b20}
.sim.done{border-color:#9ccc9f;background:#f6fbf5}
.sim.done::after{content:"✓";position:absolute;right:14px;bottom:8px;font:700 26px Georgia;color:var(--green)}
.sol{display:none;margin-top:8px;padding:8px 12px;border-left:3px solid var(--acc);background:#fbf7ec}
.sol.show{display:block}
.score{font-weight:700;color:var(--acc)}
@media (max-width:1150px){
  .lab{grid-template-columns:1fr}
  .ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:start}
}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav.side{position:static;flex-direction:row;overflow-x:auto}
  .pcard{min-width:190px}
  .sheet::before{left:14px}
  .phead,.tabs,.pane{padding-left:26px}
  .cond{flex-direction:column}
  header.top{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Ауыл олимпиадасы · тренажер</h1>
      <div class="sub">9 сынып · аудандық және облыстық кезеңдердің 8 есебі — оңайдан қиынға, баспалдақпен, анимациямен</div>
    </div>
    <div class="badge">шешілген есептер<b id="total">0</b></div>
  </header>
  <nav class="side" id="nav"></nav>
  <main><div class="sheet" id="sheet"></div></main>
</div>
<script>
/* ===================== көмекшілер ===================== */
const $ = (s, el = document) => el.querySelector(s);
const F = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const S = x => `<span class="sq">√<span>${x}</span></span>`;
const num = s => parseFloat(String(s).replace(",", ".").replace(/\s/g, ""));
const fx = (x, d = 2) => (Math.round(x * 10 ** d) / 10 ** d).toString().replace(".", ",");
const near = (v, a, tol = .03) => Math.abs(v - a) <= Math.max(Math.abs(a) * tol, 1e-9);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let solved = store.get("aul9_solved", {});
function si(v, unit) {
  const a = Math.abs(v);
  if (a === 0) return "0 " + unit;
  if (a < 9.995e-4) return fx(v * 1e6, 2) + " мк" + unit;
  if (a < .9995) return fx(v * 1e3, 2) + " м" + unit;
  return fx(v, 3) + " " + unit;
}
function txt(ctx, s, x, y, size = 14, col = "#1d2a44", bold = false) { ctx.fillStyle = col; ctx.font = `${bold ? "bold " : ""}${size}px Segoe UI`; ctx.fillText(s, x, y); }

/* ===== облыстық кезең тренажерінен алынған суреттер мен анимациялар ===== */
/* ===================== СУРЕТТЕР ===================== */
function circuitSVG(w = 300) {
  const box = (x, y, l) => `<rect x="${x}" y="${y - 9}" width="70" height="18" fill="#fff" stroke="#1d2a44" stroke-width="2"/><text x="${x + 35}" y="${y - 15}" text-anchor="middle" font-family="Times New Roman" font-style="italic" font-size="17">${l}</text>`;
  return `<svg viewBox="0 0 440 170" width="${w}" aria-label="схема">
  <g stroke="#1d2a44" stroke-width="2" fill="none">
   <path d="M10 90H60M60 90V40H126M134 40H200V90M60 90V140H95M165 140H200V90M200 90H240M240 90V40H275M345 40H380V90M240 90V140H275M345 140H380V90M380 90H430"/>
   <path d="M126 24V56M134 24V56" stroke-width="3"/>
  </g>
  <g fill="#1d2a44"><circle cx="60" cy="90" r="4"/><circle cx="200" cy="90" r="4"/><circle cx="240" cy="90" r="4"/><circle cx="380" cy="90" r="4"/></g>
  <text x="140" y="20" font-family="Times New Roman" font-style="italic" font-size="17">C</text>
  ${box(95, 140, "R")}${box(275, 40, "3R")}${box(275, 140, "2R")}
  </svg>`;
}
function grapheneFig(cv) {
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, d = 16;
  ctx.fillStyle = "#3b3f47"; ctx.fillRect(0, 0, W, H);
  const at = latticeAtoms(d, W, H, -20, -10);
  ctx.strokeStyle = "#9aa3ad"; ctx.lineWidth = 2;
  at.bonds.forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); });
  at.atoms.forEach(([x, y]) => { const g = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, 5); g.addColorStop(0, "#fff"); g.addColorStop(1, "#8b939c"); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill(); });
}

/* ===================== ТОР ГЕОМЕТРИЯСЫ ===================== */
function hexVerts(cx, cy, d) { const v = []; for (let k = 0; k < 6; k++) { const a = (-90 + 60 * k) * Math.PI / 180; v.push([cx + d * Math.cos(a), cy + d * Math.sin(a)]); } return v; }
function latticeAtoms(d, W, H, ox, oy) {
  const atoms = new Map(), bonds = new Map(), s3 = Math.sqrt(3);
  for (let j = -1; j * 1.5 * d < H + 2 * d; j++) for (let i = -1; i * s3 * d < W + 2 * d; i++) {
    const cx = ox + s3 * d * (i + (((j % 2) + 2) % 2) / 2), cy = oy + 1.5 * d * j, v = hexVerts(cx, cy, d);
    v.forEach((p, k) => {
      const key = p.map(z => Math.round(z)).join(","); atoms.set(key, p);
      const q = v[(k + 1) % 6], bk = [key, q.map(z => Math.round(z)).join(",")].sort().join("|"); bonds.set(bk, [p, q]);
    });
  }
  return { atoms: [...atoms.values()], bonds: [...bonds.values()] };
}

/* ===================== АНИМАЦИЯЛАР ===================== */
const ANIM = {};
let active = null;

function setupCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(10, r.width * dpr); cv.height = Math.max(10, r.height * dpr);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, W: r.width, H: r.height };
}
function slider(id, label, min, max, step, val, fmt) {
  return `<div class="row"><label><span>${label}</span><span id="${id}V"></span></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-fmt="${fmt || ""}"></div>`;
}
function bindSliders(root, cb) {
  root.querySelectorAll("input[type=range]").forEach(s => {
    const upd = () => { const f = s.dataset.fmt; $("#" + s.id + "V", root).textContent = f ? f.replace("#", fx(+s.value, 2)) : s.value; };
    s.addEventListener("input", () => { upd(); cb && cb(); }); upd();
  });
}
const val = id => +document.getElementById(id).value;
function arrow(ctx, x1, y1, x2, y2, col, w = 3) {
  const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1); if (L < 2) return;
  ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - 9 * Math.cos(a), y2 - 9 * Math.sin(a)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - 12 * Math.cos(a - .4), y2 - 12 * Math.sin(a - .4)); ctx.lineTo(x2 - 12 * Math.cos(a + .4), y2 - 12 * Math.sin(a + .4)); ctx.fill();
}

/* ---------- 1. Графен анимациясы ---------- */
ANIM.g = {
  html: `<div class="lab"><div><div class="stage"><canvas id="gC"></canvas></div>
  <div class="caption">Әр төбедегі атомның ұяшық <b>ішіне түскен бөлігі</b> боялады. Бұрышқа қарап үлесін есепте: 120° → ⅓, 60° → ⅙.</div></div>
  <div class="ctrl">
   <div class="btns"><button class="btn sm pri" id="gHex">Алтыбұрыш ұяшық</button><button class="btn sm" id="gRh">Ромб ұяшық</button></div>
   <button class="btn" id="gPlay">▶ Атомдарды санау</button>
   <div class="readout" id="gOut"></div>
   ${slider("gA", "a, Å (ең жақын арақашықтық)", 1.2, 3, .02, 2.46, "# Å")}
   ${slider("gM", "M, м.а.б.", 6, 30, 1, 12, "# м.а.б.")}
   <div class="readout" id="gRes"></div>
  </div></div>`,
  init() {
    this.mode = "hex"; this.t = 0; this.play = true;
    $("#gHex").onclick = () => { this.mode = "hex"; this.t = 0; this.play = true; $("#gHex").classList.add("pri"); $("#gRh").classList.remove("pri"); };
    $("#gRh").onclick = () => { this.mode = "rh"; this.t = 0; this.play = true; $("#gRh").classList.add("pri"); $("#gHex").classList.remove("pri"); };
    $("#gPlay").onclick = () => { this.t = 0; this.play = true; };
    bindSliders($("#sheet"), () => this.calc()); this.calc(); this.resize();
  },
  calc() {
    const a = val("gA") * 1e-10, M = val("gM") * 1.66e-27, S6 = 3 * Math.sqrt(3) / 2 * a * a, sig = 2 * M / S6;
    const sig2 = 2 * M / (Math.sqrt(3) / 2 * a * a);
    $("#gRes").innerHTML = `S<sub>⬡</sub> = ${fx(S6 * 1e20, 2)}·10⁻²⁰ м²<br>σ = 2M/S = <b>${fx(sig * 1e7, 2)}·10⁻⁷ кг/м²</b><br><span style="opacity:.8">a — период болса: ${fx(sig2 * 1e7, 2)}·10⁻⁷ кг/м²</span>`;
  },
  resize() { this.cv = setupCanvas($("#gC")); },
  step(dt) {
    if (this.play) this.t += dt;
    const { ctx, W, H } = this.cv, d = Math.max(30, Math.min(48, W / 8)), s3 = Math.sqrt(3);
    ctx.fillStyle = "#f8f6f0"; ctx.fillRect(0, 0, W, H);
    const ox = W / 2 - s3 * d * 2.5, oy = H / 2 - 1.5 * d * 2;
    const L = latticeAtoms(d, W, H, ox, oy);
    ctx.strokeStyle = "#b7bcc4"; ctx.lineWidth = 3;
    L.bonds.forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); });
    // ұяшық
    const cx = ox + s3 * d * 2.5, cy = oy + 1.5 * d * 2; // j=2 жұп қатар → i=2, сдвиг 0 → cx = ox + s3 d*2 ; түзету төменде
    const c0 = [ox + s3 * d * 2, oy + 1.5 * d * 2];
    let poly, corners;
    const R = 13;
    if (this.mode === "hex") {
      poly = hexVerts(c0[0], c0[1], d);
      corners = poly.map((p, k) => { const th = (-90 + 60 * k) * Math.PI / 180 + Math.PI; return { p, a0: th - Math.PI / 3, a1: th + Math.PI / 3, frac: "⅓" }; });
    } else {
      const P0 = [c0[0], c0[1] - d], a1 = [s3 * d, 0], a2 = [s3 * d / 2, 1.5 * d];
      const P1 = [P0[0] + a1[0], P0[1]], P2 = [P1[0] + a2[0], P1[1] + a2[1]], P3 = [P0[0] + a2[0], P0[1] + a2[1]];
      poly = [P0, P1, P2, P3]; const r = Math.PI / 180;
      corners = [{ p: P0, a0: 0, a1: 60 * r, frac: "⅙" }, { p: P1, a0: 60 * r, a1: 180 * r, frac: "⅓" }, { p: P2, a0: 180 * r, a1: 240 * r, frac: "⅙" }, { p: P3, a0: 240 * r, a1: 360 * r, frac: "⅓" },
        { p: [P0[0] + (a1[0] + a2[0]) / 3, P0[1] + (a1[1] + a2[1]) / 3], a0: 0, a1: 2 * Math.PI, frac: "1" }];
    }
    ctx.fillStyle = "rgba(47,93,98,.12)"; ctx.strokeStyle = "#2f5d62"; ctx.lineWidth = 3; ctx.setLineDash([8, 5]);
    ctx.beginPath(); poly.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    // атомдар

  step(dt) {

ANIM.t = {
  html: `<div class="lab"><div><div class="stage"><canvas id="tC"></canvas></div>
  <div class="caption">Түйін түсі — потенциал (қызыл = 12 В, көк = 0). Нүктелер — ток, жылдамдығы ток күшіне пропорционал. M мен N бірдей түсті болса — MN-де ток жоқ!</div></div>
  <div class="ctrl">
   <div class="btns"><button class="btn sm" id="tAN">✂ AN кесу</button><button class="btn sm" id="tMN">✂ MN кесу</button><button class="btn sm" id="tBM">✂ BM кесу</button></div>
   ${slider("tR", "R", 200, 3000, 100, 1600, "# Ом")}
   ${slider("tU", "U₀", 2, 24, 1, 12, "# В")}
   <div class="readout" id="tOut"></div>
  </div></div>`,
  init() {
    this.cut = {}; this.ph = {};
    ["AN", "MN", "BM"].forEach(k => $("#t" + k).onclick = () => { this.cut[k] = !this.cut[k]; $("#t" + k).classList.toggle("pri", !!this.cut[k]); this.calc(); });
    bindSliders($("#sheet"), () => this.calc()); this.resize(); this.calc();
  },
  resize() { this.cv = setupCanvas($("#tC")); },
  calc() {
    const R = val("tR"), U = val("tU"), g = e => this.cut[e] ? 0 : 1 / R;
    const E = { AB: 1 / R, AM: 1 / R, AN: g("AN"), MB: g("BM"), NB: 1 / R, MN: g("MN") };
    // M, N потенциалдары: Кирхгоф
    const a11 = E.AM + E.MB + E.MN, a12 = -E.MN, b1 = E.AM * U, a21 = -E.MN, a22 = E.AN + E.NB + E.MN, b2 = E.AN * U;
    const det = a11 * a22 - a12 * a21, VM = (b1 * a22 - a12 * b2) / det, VN = (a11 * b2 - a21 * b1) / det;
    this.V = { A: U, B: 0, M: VM, N: VN }; this.U = U;
    this.I = {}; for (const [k, gg] of Object.entries(E)) this.I[k] = (this.V[k[0]] - this.V[k[1]]) * gg;
    const Itot = this.I.AB + this.I.AM + this.I.AN, I0 = 2 * U / R;
    this.Imax = I0 / 2;
    $("#tOut").innerHTML = `φ<sub>M</sub> = ${fx(VM, 2)} В, φ<sub>N</sub> = ${fx(VN, 2)} В<br>R<sub>AB</sub> = <b>${fx(U / Itot, 1)} Ом</b> (${fx(U / Itot / R, 3)}·R)<br>I = <b>${si(Itot, "А")}</b><br>Бүтін тетраэдрде: ${si(I0, "А")}<br>ΔI = <b>${si(I0 - Itot, "А")}</b>`;
  },
  step(dt) {
    const { ctx, W, H } = this.cv, s = Math.min(W / 520, H / 400), ox = (W - 480 * s) / 2, oy = 30;
    const P = { A: [40, 190], B: [440, 190], N: [250, 30], M: [220, 360] }, p = k => [ox + P[k][0] * s, oy + P[k][1] * s];
    ctx.fillStyle = "#fbfaf6"; ctx.fillRect(0, 0, W, H);
    const col = v => { const k = v / this.U; return `rgb(${Math.round(42 + 150 * k)},${Math.round(111 - 50 * k)},${Math.round(176 - 140 * k)})`; };
    for (const e of ["AB", "AM", "AN", "MB", "NB", "MN"]) {
      const cut = (e === "AN" && this.cut.AN) || (e === "MB" && this.cut.BM) || (e === "MN" && this.cut.MN);
      const [x1, y1] = p(e[0]), [x2, y2] = p(e[1]);
      ctx.strokeStyle = cut ? "#d8cfc0" : "#1d2a44"; ctx.lineWidth = 3; ctx.setLineDash(e === "AB" ? [8, 6] : cut ? [3, 6] : []);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
      // резистор белгісі
      const fr = e === "AB" ? .27 : e === "MN" ? .72 : .5; // AB мен MN белгілері қиылыста бір-біріне түспесін
      const mx = x1 + (x2 - x1) * fr, my = y1 + (y2 - y1) * fr, an = Math.atan2(y2 - y1, x2 - x1);
      ctx.save(); ctx.translate(mx, my); ctx.rotate(an); ctx.fillStyle = cut ? "#f3efe6" : "#fff"; ctx.strokeStyle = cut ? "#d8cfc0" : "#1d2a44"; ctx.lineWidth = 2;
      ctx.fillRect(-22, -8, 44, 16); ctx.strokeRect(-22, -8, 44, 16); ctx.restore();

  $("#nav").innerHTML = `<div class="ladder-title"><span>оңай</span><span>↓</span><span>қиын</span></div>` +
    P.map((p, i) => `<button class="pcard ${i === cur ? "on" : ""}" style="--c:var(${p.color})" data-i="${i}"><span class="no">${i + 1}</span><span><b>${p.name}</b><small>${p.src}</small><br><span class="st">${"★".repeat(p.stars)}${"☆".repeat(4 - p.stars)}</span><div class="bar"><i style="width:${nDone(p) / 4 * 100}%"></i></div></span></button>`).join("") +
    `<div class="note">Есептер қиындығы бойынша реттелген. Әр есепте: баспалдақ → анимация → олимпиада есебі → C деңгейлі есептер. Нәтиже осы құрылғыда сақталады.</div>`;
  $("#nav").querySelectorAll(".pcard").forEach(b => b.onclick = () => { cur = +b.dataset.i; curTab = "ladder"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
}
function render() {
  active = null; renderNav();
  const p = P[cur]; document.documentElement.style.setProperty("--acc", `var(${p.color})`);
  const tabs = [["ladder", "1 · Баспалдақ"], ["anim", "2 · Анимация"], ["solve", "3 · Олимпиада есебі"], ["sim", "4 · C деңгейлі есептер"]];
  $("#sheet").innerHTML = `<div class="phead"><h2>${cur + 1}. ${p.name}</h2><div class="pts">${p.src} · ${p.short} · қиындығы ${"★".repeat(p.stars)}</div></div>
  <div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${k === curTab ? "on" : ""}" data-k="${k}">${n}</button>`).join("")}</div><div class="pane" id="pane"></div>`;
  $("#sheet").querySelectorAll(".tab").forEach(b => b.onclick = () => { curTab = b.dataset.k; render(); });
  const pane = $("#pane");
  if (curTab === "ladder") renderLadder(p, pane);
  if (curTab === "anim") { pane.innerHTML = ANIM[p.id].html + nextBtn("solve", "Олимпиада есебіне өту"); active = ANIM[p.id]; active.init(); }
  if (curTab === "solve") renderSolve(p, pane);
  if (curTab === "sim") renderSim(p, pane);
  pane.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { curTab = b.dataset.go; render(); });
}
const nextBtn = (k, l) => `<div class="btns" style="margin-top:18px"><button class="btn pri" data-go="${k}">${l} →</button></div>`;
function renderLadder(p, pane) {
  pane.innerHTML = `<h3>Керек білім</h3><div class="know">${p.know.map(([a, b]) => `<div><b>${a}</b>${b}</div>`).join("")}</div>
  <div class="box why"><b>Олимпиадалық кілт:</b> ${p.key}</div>
  <h3>Баспалдақ: оңайдан қиынға</h3><p>Әр сатыдағы шағын есепті шығар — жауап дұрыс болса, келесі саты ашылады. Соңғы саты — олимпиада есебінің өзі.</p>
  <div class="rungs">${p.rungs.map(([lv, q, u], i) => `<div class="rung ${i === 0 ? "show" : ""}" data-n="${i + 1}" data-r="${i}"><div class="lv">${lv}</div><p>${q}</p>
    <div class="answer"><input inputmode="decimal"><span>${u}</span><button class="btn sm pri" data-a="chk">Тексеру</button><button class="btn sm" data-a="show">Көрсету</button><span class="fb"></span></div><div class="ex"></div></div>`).join("")}
    <div class="rung final" data-n="★" data-r="${p.rungs.length}"><div class="lv">Олимпиада деңгейі</div><p>Енді сатылар дайын. Анимацияда процесті көзбен көр, содан кейін олимпиада есебін өзің шығар.</p>${nextBtn("anim", "Анимацияға өту")}</div></div>`;
  pane.querySelectorAll(".rung[data-r]").forEach(rg => {
    const i = +rg.dataset.r; if (i >= p.rungs.length) return; const [, , , ans, ex] = p.rungs[i];
    const open = () => { rg.querySelector(".ex").innerHTML = "💡 " + ex; rg.querySelector(".ex").classList.add("show"); const nx = pane.querySelector(`.rung[data-r="${i + 1}"]`); if (nx && !nx.classList.contains("show")) setTimeout(() => { nx.classList.add("show"); nx.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 400); };
    rg.querySelector('[data-a="chk"]').onclick = () => { const v = num(rg.querySelector("input").value), fb = rg.querySelector(".fb"); if (isNaN(v)) { fb.className = "fb bad"; fb.textContent = "Сан енгіз"; return; } if (near(v, ans, .03)) { fb.className = "fb ok"; fb.textContent = "✔ Дұрыс!"; open(); } else { fb.className = "fb bad"; fb.textContent = "✘ Қайта ойлан"; } };
    rg.querySelector('[data-a="show"]').onclick = () => { const fb = rg.querySelector(".fb"); fb.className = "fb"; fb.textContent = "Жауабы: " + fx(ans, 3) + " " + p.rungs[i][2]; open(); };
  });
}
function renderSolve(p, pane) {
  pane.innerHTML = `<h3>Шарты</h3><div class="cond"><div class="txt"><span class="src">${p.src}</span><br>${p.cond}</div>${p.fig ? `<div>${p.fig()}</div>` : ""}</div>
  <h3>Өзің шығар</h3>
  ${p.inputs.map((inp, i) => `<div class="answer"><b>${inp.label}</b><input id="ans${i}" inputmode="decimal"><span>${inp.unit}</span><button class="btn sm pri" data-i="${i}">Тексеру</button><span class="fb" id="fb${i}"></span></div>`).join("")}
  <div class="btns"><button class="btn sm" id="hintB">💡 Кеңес (${p.hints.length})</button><button class="btn sm" id="stepB">Шешімді қадаммен көрсету →</button><button class="btn sm" id="allB">Бәрін ашу</button></div>
  ${p.hints.map(h => `<div class="hint">${h}</div>`).join("")}
  <div class="steps">${p.steps.map(([t, b, c]) => `<div class="step ${c ? "chk" : ""}"><h4>${t}</h4>${b}</div>`).join("")}</div>` + nextBtn("sim", "C деңгейлі есептерге өту");
  if (p.id === "g") grapheneFig($("#figG"));
  pane.querySelectorAll(".answer .btn").forEach(b => b.onclick = () => {
    const i = +b.dataset.i, inp = p.inputs[i], v = num($("#ans" + i).value), fb = $("#fb" + i);
    if (isNaN(v)) { fb.className = "fb bad"; fb.textContent = "Сан енгіз"; return; }
    if (near(v, inp.ans, inp.tol || .03)) { fb.className = "fb ok"; fb.textContent = "✔ Дұрыс!"; }
    else if (inp.alt && near(v, inp.alt, .05)) { fb.className = "fb ok"; fb.textContent = "✔ " + inp.altMsg; }
    else { fb.className = "fb bad"; fb.textContent = "✘ Әлі емес — кеңесті қара"; }
    if (p.inputs.every((_, j) => $("#fb" + j).classList.contains("ok"))) { solved[p.id + "main"] = 1; store.set("aul9_solved", solved); renderNav(); }
  });
  let hi = 0, si_ = 0; const hs = pane.querySelectorAll(".hint"), ss = pane.querySelectorAll(".step");
  $("#hintB").onclick = () => { if (hi < hs.length) hs[hi++].classList.add("show"); };
  $("#stepB").onclick = () => { if (si_ < ss.length) { ss[si_].classList.add("show"); ss[si_].scrollIntoView({ behavior: "smooth", block: "nearest" }); si_++; } };
  $("#allB").onclick = () => { ss.forEach(s => s.classList.add("show")); si_ = ss.length; };
}
function renderSim(p, pane) {
  const done = () => p.similar.filter((_, j) => solved[p.id + j]).length;
  pane.innerHTML = `<p>Олимпиада есебінің идеясын басқаша қолданатын C деңгейлі есептер. Алдымен өзің ойлан, кейін кеңесті, ең соңында шешімді аш.</p><p class="score" id="simScore"></p>
  ${p.similar.map((s, j) => `<div class="sim ${solved[p.id + j] ? "done" : ""}" id="sim${j}"><span class="lvl">C деңгей</span>
    <p style="padding-right:80px"><b>${j + 1}.</b> ${s.q}</p>
    <div class="answer"><input id="sa${j}" inputmode="decimal"><span>${s.unit}</span><button class="btn sm pri" data-j="${j}" data-a="chk">Тексеру</button><button class="btn sm" data-j="${j}" data-a="hint">💡</button><button class="btn sm" data-j="${j}" data-a="sol">Шешімі</button><span class="fb" id="sf${j}"></span></div>
    <div class="hint" id="sh${j}">${s.hint}</div><div class="sol" id="ss${j}">${s.sol}</div></div>`).join("")}` +
    (cur < P.length - 1 ? nextBtn("next", `Келесі есеп: ${P[cur + 1].name}`) : `<div class="box tip"><b>Жарайсың!</b> Барлық 8 есептің баспалдағынан өттің.</div>`);
  const upd = () => $("#simScore").textContent = `Шешілді: ${done()} / ${p.similar.length}`; upd();
  pane.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const j = +b.dataset.j, s = p.similar[j], a = b.dataset.a;
    if (a === "hint") $("#sh" + j).classList.add("show");
    if (a === "sol") $("#ss" + j).classList.add("show");
    if (a === "chk") {
      const v = num($("#sa" + j).value), fb = $("#sf" + j);
      if (isNaN(v)) { fb.className = "fb bad"; fb.textContent = "Сан енгіз"; return; }
      if (near(v, s.ans, s.tol || .03)) { fb.className = "fb ok"; fb.textContent = "✔ Дұрыс!"; solved[p.id + j] = 1; store.set("aul9_solved", solved); $("#sim" + j).classList.add("done"); upd(); renderNav(); }
      else { fb.className = "fb bad"; fb.textContent = "✘ Қайта тексер"; }
    }
  });
  const nb = pane.querySelector('[data-go="next"]'); if (nb) nb.onclick = () => { cur++; curTab = "ladder"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
}

/* ===================== ЦИКЛ ===================== */
let last = performance.now();
function loop(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; if (active && active.cv) active.step(dt); requestAnimationFrame(loop); }
addEventListener("resize", () => { if (active && active.resize) active.resize(); });
render(); requestAnimationFrame(loop);
</script>
</body>
</html>
